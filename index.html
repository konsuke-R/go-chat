<!DOCTYPE html>
<html lang="ja">

<head>
    <title>Go WebSocket Chat</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }

        .system {
            color: gray;
            font-style: italic;
        }

        .history {
            color: #888;
        }
    </style>
</head>

<body>
    <h2>Go Chat Room</h2>
    <div id="messages"></div>
    <input id="input" type="text" placeholder="Message or /nick [name]" style="width: 80%">
    <button onclick="send()">Send</button>

    <script>
        const messages = document.getElementById("messages");
        const input = document.getElementById("input");
        const ws = new WebSocket(`ws://${window.location.host}/ws`);

        ws.onmessage = (event) => {
            const item = document.createElement("div");
            item.innerText = event.data;
            if (event.data.startsWith("SYSTEM:")) item.className = "system";
            if (event.data.startsWith("HISTORY:")) item.className = "history";
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        };

        function send() {
            if (input.value) {
                ws.send(input.value);
                input.value = "";
            }
        }

        input.onkeydown = (e) => { if (e.key === "Enter") send(); };
    </script>
</body>

</html>
